AWSTemplateFormatVersion: '2010-09-09'
Description: Remote MCP server running on AWS App Runner with DynamoDB access.

Parameters:
  ImageUri:
    Type: String
    Description: Full ECR image URI including tag.
  JobsTableName:
    Type: String
    Default: HiringAgent_Jobs
  ApplicationsTableName:
    Type: String
    Default: HiringAgent_Applications
  ServiceName:
    Type: String
    Default: hiring-agent-mcp

Resources:
  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ServiceName}-ecr-access'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ServiceName}-instance'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTableName}/index/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApplicationsTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApplicationsTableName}/index/*'

  McpService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Ref ServiceName
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: '8000'
            StartCommand: python server.py streamable-http
            RuntimeEnvironmentVariables:
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: DYNAMODB_JOBS_TABLE
                Value: !Ref JobsTableName
              - Name: DYNAMODB_APPLICATIONS_TABLE
                Value: !Ref ApplicationsTableName
              - Name: MCP_HOST
                Value: 0.0.0.0
              - Name: MCP_PORT
                Value: '8000'
              - Name: MCP_PATH
                Value: /mcp
              - Name: MCP_JSON_RESPONSE
                Value: 'true'
              - Name: MCP_STATELESS_HTTP
                Value: 'true'
      InstanceConfiguration:
        Cpu: 1 vCPU
        Memory: 2 GB
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5

Outputs:
  McpServiceUrl:
    Description: HTTPS URL for the remote MCP service.
    Value: !GetAtt McpService.ServiceUrl
  McpServiceArn:
    Description: App Runner service ARN.
    Value: !GetAtt McpService.ServiceArn
  McpEndpointUrl:
    Description: Streamable HTTP MCP endpoint.
    Value: !Sub 'https://${McpService.ServiceUrl}/mcp'
